---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check essential packages are installed
      ansible.builtin.command: dpkg -s {{ item }}
      loop:
        - git
        - curl
        - vim
        - htop
        - tmux
        - jq
      changed_when: false

    - name: Check Docker is installed
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Check Node.js is installed
      ansible.builtin.command: node --version
      changed_when: false

    - name: Check Claude Code is installed
      ansible.builtin.command: claude --version
      changed_when: false

    - name: Check Claude profile script exists
      ansible.builtin.stat:
        path: /etc/profile.d/claude.sh
      register: claude_profile

    - name: Assert Claude profile script exists
      ansible.builtin.assert:
        that: claude_profile.stat.exists
