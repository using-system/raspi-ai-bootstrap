---
- name: Update apt cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ base_hostname }}"
  when: not (molecule_test | default(false))

- name: Update /etc/hosts with hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1\t{{ base_hostname }}"
  when: not (molecule_test | default(false))

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Generate locale
  community.general.locale_gen:
    name: "{{ base_locale }}"
    state: present
  when: not (molecule_test | default(false))

- name: Set default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    content: |
      LANG={{ base_locale }}
      LC_ALL={{ base_locale }}
    mode: "0644"

- name: Configure UFW - deny all incoming by default
  community.general.ufw:
    default: deny
    direction: incoming
  when: not (molecule_test | default(false))

- name: Configure UFW - allow all outgoing by default
  community.general.ufw:
    default: allow
    direction: outgoing
  when: not (molecule_test | default(false))

- name: Configure UFW - allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  when: not (molecule_test | default(false))

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: not (molecule_test | default(false))
