---
- name: Add NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Add NodeSource apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/nodesource.asc]
      https://deb.nodesource.com/node_{{ nodejs_major_version }}.x
      nodistro main
    filename: nodesource
    state: present

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Install Claude Code globally via npm
  community.general.npm:
    name: "@anthropic-ai/claude-code"
    global: true
    state: present

- name: Deploy Claude Code environment profile script
  ansible.builtin.template:
    src: claude.sh.j2
    dest: /etc/profile.d/claude.sh
    mode: "0600"
    owner: root
    group: root
