---
all:
  hosts:
    raspi:
      # ── Connection ─────────────────────────────────────────────
      ansible_host: 192.168.1.100  # Change this to your Pi's IP address
      ansible_user: pi
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519

      # ── Base OS (role: base) ───────────────────────────────────
      # base_hostname: raspi-ai           # Pi hostname
      # base_locale: en_US.UTF-8          # System locale
      # base_timezone: Europe/Paris       # Timezone (timedatectl list-timezones)

      # ── Node.js / Claude Code (role: claude-code) ──────────────
      # nodejs_major_version: "22"        # Node.js LTS major version
      # anthropic_api_key: "..."          # Set via Vault (see README)
      # claude_superpowers_enabled: true  # Install Superpowers plugin
